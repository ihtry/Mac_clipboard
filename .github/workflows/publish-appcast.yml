name: Publish Sparkle Appcast

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish in the appcast, for example v1.0.2"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: appcast
  cancel-in-progress: false

jobs:
  publish-appcast:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,url)"
          echo "tag=$(jq -r '.tagName' <<< "$release_json")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.url' <<< "$release_json")" >> "$GITHUB_OUTPUT"

      - name: Download release DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ steps.release.outputs.tag }}" \
            --pattern "T-clipboard.dmg" \
            --dir dist \
            --clobber

      - name: Install Sparkle tools
        run: |
          set -euo pipefail
          brew install --cask sparkle

      - name: Import Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" > sparkle_private_key
          chmod 600 sparkle_private_key

      - name: Generate appcast
        env:
          DOWNLOAD_URL_PREFIX: https://github.com/ihtry/Mac_clipboard/releases/download/${{ steps.release.outputs.tag }}/
        run: |
          set -euo pipefail
          find /Applications /opt/homebrew/Caskroom /usr/local/Caskroom -name generate_appcast -type f 2>/dev/null || true
          GENERATE_APPCAST="$(find /Applications /opt/homebrew/Caskroom /usr/local/Caskroom -name generate_appcast -type f -print -quit 2>/dev/null)"
          test -n "$GENERATE_APPCAST"
          echo "Using $GENERATE_APPCAST"
          "$GENERATE_APPCAST" \
            --ed-key-file sparkle_private_key \
            --download-url-prefix "$DOWNLOAD_URL_PREFIX" \
            dist

      - name: Store appcast in repository root
        run: |
          set -euo pipefail
          cp dist/appcast.xml appcast.xml

      - name: Commit appcast.xml
        run: |
          set -euo pipefail
          if git diff --quiet -- appcast.xml; then
            echo "appcast.xml is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast for ${{ steps.release.outputs.tag }}"
          git push origin HEAD:main
